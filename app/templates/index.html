
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <div class="container">

        <h1>Sentiment Analysis WebApp</h1>

        <p>Analyze customer reviews using Machine Learning.</p>

        <form id="sentimentForm">

            <label for="heading">Review Heading</label>
            <input
                type="text"
                id="heading"
                placeholder="Enter review heading"
                required
            >

            <label for="review">Customer Review</label>
            <textarea
                id="review"
                rows="6"
                placeholder="Enter customer review"
                required
            ></textarea>

            <label for="model">Select Model</label>

            <select id="model" required>
                <option value="tfidf">
                    TF-IDF + Logistic Regression
                </option>

                <option value="word2vec">
                    Word2Vec + Logistic Regression
                </option>
            </select>

            <button type="submit">Predict Sentiment</button>

        </form>

        <div id="result" class="result"></div>

    </div>

    <script src="/static/js/script.js"></script>

</body>
</html>
