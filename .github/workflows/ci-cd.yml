
name: Sentiment Analysis CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:

  # JOB 1 - Code Quality
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies and quality tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black isort flake8

      - name: Check formatting with Black
        run: black --check --diff app/ tests/

      - name: Check imports with isort
        run: python -m isort --profile black --check-only --diff app/ tests/

      - name: Lint with Flake8
        run: python -m flake8 --max-line-length=88 --extend-ignore=E203,W503 app/ tests/

  # JOB 2 - Unit and Integration Tests
  test:
    name: Tests and Coverage
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --verbose \
            --tb=short \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # JOB 3 - Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          pip install bandit pip-audit

      - name: Static security analysis
        run: |
          bandit -r app/ -ll

      - name: Audit dependencies
        run: |
          pip-audit -r requirements.txt

  # JOB 4 - Build and Smoke Test
  build:
    name: Build and Smoke Test
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify application imports
        run: |
          python -c "from app.main import app; print('Application imported successfully')"

      - name: Verify trained models load
        run: |
          python -c "from app.services.model_loader import load_models; models = load_models(); assert all(model is not None for model in models); print('All four trained model components loaded successfully')"

      - name: Start application and smoke test
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!

          for i in {1..15}; do
            if curl --fail --silent http://localhost:8000/; then
              echo "Application smoke test passed"
              kill $SERVER_PID
              exit 0
            fi
            sleep 2
          done

          echo "Application smoke test failed"
          kill $SERVER_PID || true
          exit 1

  # JOB 5 - Deploy to Render
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Render deploy hook not configured. Skipping deployment."
            exit 0
          fi

          curl --fail --silent --show-error \
            -X POST "$RENDER_DEPLOY_HOOK_URL"

          echo "Render deployment triggered successfully"

      - name: Post-deployment smoke test
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ] || [ -z "$RENDER_APP_URL" ]; then
            echo "Render deployment or app URL not configured. Skipping health check."
            exit 0
          fi

          echo "Waiting for Render deployment..."

          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "$RENDER_APP_URL/" || true)

            if [ "$STATUS" = "200" ]; then
              echo "Production smoke test passed"
              exit 0
            fi

            sleep 10
          done

          echo "Production smoke test failed"
          exit 1
